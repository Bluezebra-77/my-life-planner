<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1769c2">
  <title>My Life Planner update recovery</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef3ef;color:#243229;margin:0;padding:24px}
    main{max-width:680px;margin:40px auto;background:white;border-radius:22px;padding:24px;box-shadow:0 10px 30px rgba(36,50,41,.12)}
    h1{margin-top:0} button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 18px;background:#1769c2;color:white;cursor:pointer}
    #status{margin-top:18px;line-height:1.5}.note{color:#5f6f65}.ok{color:#236a3b;font-weight:700}.error{color:#a12c2c;font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>My Life Planner update recovery</h1>
  <p>This removes only old My Life Planner service workers and caches. It does <strong>not</strong> delete your planner data stored in local storage.</p>
  <button id="recoverButton" type="button">Recover update to v54cR2</button>
  <p id="status" class="note">Keep this page open until recovery completes.</p>
</main>
<script>
(async()=>{
  const button=document.getElementById('recoverButton');
  const status=document.getElementById('status');
  button.addEventListener('click', async()=>{
    button.disabled=true;
    status.textContent='Removing old service workers and planner caches…';
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(k=>k.startsWith('my-life-planner-')).map(k=>caches.delete(k)));
      }
      status.className='ok';
      status.textContent='Recovery complete. Loading the current planner…';
      const target=new URL('./index.html', location.href);
      target.searchParams.set('recovered','54cR2');
      target.searchParams.set('t',Date.now().toString());
      setTimeout(()=>location.replace(target.href),500);
    }catch(err){
      status.className='error';
      status.textContent='Recovery could not complete: '+(err?.message||String(err));
      button.disabled=false;
    }
  });
})();
</script>
</body>
</html>
